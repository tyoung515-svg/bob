name: tests

# Covers the practical v0.98 release surface: the four Python pytest suites
# (core, gateway, pipeline, TUI) plus a dependency-integrity check on Windows and
# Linux, and a separate KMM job (shared JVM tests + desktop Kotlin compile). The
# pytest suites are network-free by design: pytest-socket blocks sockets
# (`--disable-socket`) and integration tests that need Qdrant/Postgres are skipped
# unless `-m integration` is passed. So no services are required in CI.
#
# Dependencies install from each service's requirements.txt (the repo's dependency
# source of truth; it pins the aiohttp<3.14 landmine). There is no lockfile yet —
# `pip check` gates that the resolved set is at least internally consistent.
#
# Staged file: it activates when Travis pushes the branch. The overnight sprint
# fleet never runs it.

on:
  push:
  pull_request:

jobs:
  test:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bobclaw-core/requirements.txt
          pip install -r bobclaw-gateway/requirements.txt
          pip install -r bobclaw-claude-pipeline/requirements.txt
          pip install textual   # TUI runtime dep (not in a requirements file yet)

      - name: pip check (dependency integrity)
        run: python -m pip check

      - name: Core suite
        working-directory: bobclaw-core
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Gateway suite
        working-directory: bobclaw-gateway
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Pipeline suite
        working-directory: bobclaw-claude-pipeline
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: TUI suite
        working-directory: bobclaw-tui
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  kmm:
    name: kmm (shared jvmTest + desktop compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The shared module declares an Android target (compileSdk 34), so Gradle
      # needs the Android SDK even to configure :shared / :desktopApp.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Shared JVM tests + desktop compile
        working-directory: bobclaw-app
        # Invoke via `bash` — the tracked gradlew is mode 100644 (not +x), so a bare
        # ./gradlew would fail with permission denied on the Linux runner.
        run: bash ./gradlew --no-daemon :shared:jvmTest :desktopApp:compileKotlin
