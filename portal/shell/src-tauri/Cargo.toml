[package]
name = "bob-slice-shell"
version = "0.99.1"
description = "BoB vertical slice S10 webview shell (Tauri v2) over the E5 slice-v1 NDJSON protocol"
edition = "2021"
license = "Apache-2.0"

# Standalone crate: NOT a member of the repo-root cargo workspace (whose only
# member is `engine`), so `cargo build`/`cargo test` at the root are unchanged.
[workspace]

[lib]
name = "bob_slice_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
getrandom = "0.3.4"
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_ErrorReporting"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
bob-engine = { path = "../../engine" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
