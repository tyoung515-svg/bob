[package]
name = "bob-wsl-host"
version = "0.99.1"
edition = "2021"
[workspace]
[dependencies]
bob-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
