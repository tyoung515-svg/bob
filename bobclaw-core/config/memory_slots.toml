# my-bob memory slot fallback — since pin b43aaf1, bootstrap honors
# MEMORY_SLOTS_FILE, and bobclaw-core.service points it at the overlay
# memory_slots.my-bob.toml (the loaded file). This in-tree default only
# loads if that env var is unset; keep it my-bob-correct and fail-closed so
# a lost env var stays loud, not silently wrong.
# 2026-07-12: migrated off LM Studio — everything is served by llama.cpp:
#   :58081  qwen3-embedding-4b Q4_K_M, GPU-offloaded (-ngl 99)
# 2026-07-14: moved off 8081/8082 — those are LKS's stock ports
# (endpoints stay 127.0.0.1, never localhost — IPv6 rule).
# NOTE: backend = "lmstudio" is the OpenAI-protocol selector, NOT the LM Studio app.

[slot.embed_text]
model = "qwen3-embedding-4b"
backend = "lmstudio"
endpoint = "http://127.0.0.1:58081"
embedding_dimension = 2560

# Heavy/bulk slot: same GPU-offloaded :58081 server (no separate instance).
[slot.embed_text_heavy]
model = "qwen3-embedding-4b"
backend = "lmstudio"
endpoint = "http://127.0.0.1:58081"
embedding_dimension = 2560

# Extraction / rollup — RETIRED (embedding-only posture, 2026-07-20; the 4B
# extractor is out of all pipelines). Deferred fails CLOSED: the resolver
# raises if anything tries to use these slots. Do not re-point them at an
# extractor model, whatever older docs imply.
[slot.extract_small]
deferred = true

[slot.rollup_mid]
deferred = true

# Slots declared but not active — resolver raises if used.
[slot.synth_mid]
deferred = true
[slot.synth_deep]
deferred = true
[slot.audit_manager]
deferred = true
[slot.embed_multimodal]
deferred = true
[slot.embed_visual_doc]
deferred = true
[slot.rerank_cross]
deferred = true
[slot.managed_remote]
deferred = true
