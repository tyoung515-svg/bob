  - projects_list
  - project_read
  - project_files_list
  - project_files_read
  - project_files_search
  - project_git
  - bob_installation
  - bob_source_list
  - bob_source_read
  - bob_source_search
  - bob_guide
  - memory_save
  - memory_recall
  - conv_search
  - conv_expand
  - conversations_find
  - conversations_read
  - web_search
  - web_fetch
  - pipe_call
  - ask_operator
