# Scout sources registry — schema v0 (module M1 / MS8-SC1).
#
# Scout rides the Watch-pipe substrate (S1): this file is validated by
# core.watch.registry.SourcesRegistry (via core.scout.sources.load_scout_sources).
# It is the FULLER fleet view — every provider BoB actually routes (Anthropic,
# OpenAI, Google, Moonshot/Kimi, Z.AI/GLM, DeepSeek, MiniMax) plus model registries,
# local-runtime releases, MCP directories, and community/benchmark channels
# (MODULES.md M1). The watch registry's shorter list is the generic default; Scout's
# is the market-hunt surface.
#
# NO CREDENTIALS in v0 (inv.): every source is public — auth_required is false
# (enforced by the shared validator). Authed sources are a forward dependency on S3
# credential custody (MS8-CC1), not shippable here.
#
# Offline/fixture-only (inv. 11): these URLs are never fetched by the M-lane; the
# first live sweep is a post-merge attended smoke (MEGA-SPRINT-8 §7d).
version: 0

schedule:
  cron: "0 8 * * 1"        # weekly, Monday 08:00 UTC — the Scout digest cadence
  task: "run_watch"
  face_hint: "assistant"
  owner: "admin"

sources:
  # ── provider changelogs + pricing (the fleet BoB routes) ──────────────────
  - id: anthropic-news
    name: "Anthropic news / changelog"
    kind: changelog
    url: "https://www.anthropic.com/news"
    provider: anthropic
    tags: [models, releases]
    fingerprint_fields: [title, url]

  - id: anthropic-pricing
    name: "Anthropic API pricing"
    kind: pricing
    url: "https://www.anthropic.com/pricing"
    provider: anthropic
    tags: [pricing]
    fingerprint_fields: [title, url]

